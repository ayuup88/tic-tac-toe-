
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="manifest.json">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #111827, #1d4ed8);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container {
  width: 100%;
  max-width: 500px;
  text-align: center;
}
.screen {
  background: rgba(255,255,255,0.1);
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
h1 {
  font-size: 45px;
  margin-bottom: 10px;
}
h2 { margin-bottom: 20px; }
.subtitle {
  color: #dbeafe;
  margin-bottom: 25px;
}
button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: white;
  color: #111827;
}
button:hover { transform: scale(1.02); }
button:active { transform: scale(0.98); }
.back {
  background: #374151;
  color: white;
}
.hidden { display: none !important; }
#board {
  display: grid;
  gap: 6px;
  margin: 20px 0;
  width: 100%;
}
.cell {
  aspect-ratio: 1;
  background: white;
  color: #111827;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  cursor: pointer;
  min-width: 0;
}
#board.size-3 .cell {
  font-size: 55px;
  border-radius: 15px;
}
#board.size-6 .cell { font-size: 30px; }
#board.size-9 .cell {
  font-size: 20px;
  border-radius: 6px;
}
.cell:hover { background: #e5e7eb; }
.info {
  font-size: 20px;
  margin: 10px;
}
.score {
  display: flex;
  justify-content: space-around;
  margin: 15px 0;
}
#message {
  min-height: 30px;
  font-size: 22px;
  font-weight: bold;
  margin: 10px;
}
.musicButton {
  background: #facc15;
  color: #111827;
}
.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
.popupBox {
  background: white;
  color: #111827;
  width: 90%;
  max-width: 360px;
  padding: 35px 25px;
  border-radius: 25px;
  text-align: center;
  animation: popupIn 0.35s ease;
}
.popupEmoji {
  font-size: 70px;
  margin-bottom: 10px;
}
.popupBox h2 {
  font-size: 30px;
  margin-bottom: 10px;
}
.popupBox p {
  font-size: 18px;
  margin-bottom: 20px;
}
.popupBox button {
  background: #1d4ed8;
  color: white;
}
@keyframes popupIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@media (max-width: 500px) {
  h1 { font-size: 35px; }
  #board.size-3 .cell { font-size: 45px; }
  #board.size-6 .cell { font-size: 25px; }
  #board.size-9 .cell { font-size: 17px; }
}
</style>
</head>

<body>
<div class="container">

  <div id="welcomeScreen" class="screen">
    <h1>🎮 Tic-Tac-Toe</h1>
    <p class="subtitle">Welcome to the ultimate Tic-Tac-Toe game</p>
    <button onclick="enterGame()">ENTER</button>
  </div>

  <div id="menuScreen" class="screen hidden">
    <h1>🎮 Tic-Tac-Toe</h1>
    <p class="subtitle">Choose your game</p>
    <button onclick="chooseBoard('pvp')">👥 1 VS 1</button>
    <button onclick="showDifficulty()">🤖 PLAY AI</button>
    <button onclick="showOnlineMenu()">🌍 ONLINE 1 VS 1</button>
  </div>

  <div id="difficultyScreen" class="screen hidden">
    <h2>Choose Difficulty</h2>
    <button onclick="chooseBoard('ai','easy')">🟢 EASY</button>
    <button onclick="chooseBoard('ai','medium')">🟡 MEDIUM</button>
    <button onclick="chooseBoard('ai','hard')">🔴 HARD</button>
    <button class="back" onclick="showMenu()">← BACK</button>
  </div>

  <div id="boardSizeScreen" class="screen hidden">
    <h2>Choose Board Size</h2>
    <p class="subtitle">Choose how big you want your game</p>
    <button onclick="startGame(3)">⬜ 3 × 3</button>
    <button onclick="startGame(6)">🟦 6 × 6</button>
    <button onclick="startGame(9)">🟪 9 × 9</button>
    <button class="back" onclick="backFromBoardSize()">← BACK</button>
  </div>

  <div id="gameScreen" class="screen hidden">
    <h2>Tic-Tac-Toe</h2>
    <div class="info" id="boardSizeText">Board: 3 × 3</div>
    <div class="info" id="turnText">Turn: X</div>
    <div class="score">
      <span>❌ X: <b id="xScore">0</b></span>
      <span>⭕ O: <b id="oScore">0</b></span>
    </div>
    <div id="board"></div>
    <div id="message"></div>
    <button onclick="newRound()">🔄 NEW ROUND</button>
    <button class="musicButton" onclick="toggleMusic()" id="musicButton">🎵 MUSIC ON</button>
    <button class="back" onclick="showMenu()">🏠 MAIN MENU</button>
  </div>
</div>

<div id="resultPopup" class="popup hidden">
  <div class="popupBox">
    <div id="popupEmoji" class="popupEmoji">🏆</div>
    <h2 id="popupTitle">X WINS!</h2>
    <p id="popupText">Congratulations!</p>
    <button onclick="closePopup()">CONTINUE</button>
  </div>
</div>

<script>
let board = [];
let currentPlayer = "X";
let gameMode = "pvp";
let difficulty = "easy";
let gameOver = false;
let boardSize = 3;
let winLength = 3;
let xScore = 0;
let oScore = 0;

let onlineRoomCode = null;
let onlinePlayer = null;
let onlinePollTimer = null;
let onlineGameActive = false;
let onlineShownWinner = null;

let audioContext = null;
let musicPlaying = false;
let musicTimer = null;
let musicStep = 0;

const melody = [
  261.63, 329.63, 392.00, 329.63,
  293.66, 349.23, 440.00, 349.23
];

function startMusic() {
  if (musicPlaying) return;
  audioContext = audioContext ||
    new (window.AudioContext || window.webkitAudioContext)();

  if (audioContext.state === "suspended") audioContext.resume();
  musicPlaying = true;
  playNextNote();
}

function playNextNote() {
  if (!musicPlaying) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value = melody[musicStep];
  gain.gain.setValueAtTime(0.10, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001, audioContext.currentTime + 0.45
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.45);

  musicStep = (musicStep + 1) % melody.length;
  musicTimer = setTimeout(playNextNote, 500);
}

function stopMusic() {
  musicPlaying = false;
  clearTimeout(musicTimer);
}

function toggleMusic() {
  if (musicPlaying) {
    stopMusic();
    document.getElementById("musicButton").textContent = "🔇 MUSIC OFF";
  } else {
    startMusic();
    document.getElementById("musicButton").textContent = "🎵 MUSIC ON";
  }
}

function enterGame() {
  startMusic();
  document.getElementById("welcomeScreen").classList.add("hidden");
  document.getElementById("menuScreen").classList.remove("hidden");
}

function enterOnlineGame(roomCode, player, data) {
  onlineRoomCode = roomCode;
  onlinePlayer = player;
  onlineGameActive = true;
  onlineShownWinner = null;

  gameMode = "online";
  boardSize = 3;
  winLength = 3;
  board = Array.isArray(data.board) && data.board.length === 9
    ? data.board
    : Array(9).fill("");

  currentPlayer = data.turn || "X";
  gameOver = Boolean(data.winner);

  document.getElementById("welcomeScreen").classList.add("hidden");
  document.getElementById("menuScreen").classList.add("hidden");
  document.getElementById("difficultyScreen").classList.add("hidden");
  document.getElementById("boardSizeScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");

  document.getElementById("boardSizeText").textContent =
    "Online Room: " + roomCode;
  document.getElementById("message").textContent =
    player === "X"
      ? "You are X. Share room code: " + roomCode
      : "You are O. Connected to room " + roomCode;

  updateScore();
  drawBoard();
  updateTurn();

  if (onlinePollTimer) clearInterval(onlinePollTimer);
  syncOnlineGame();
  onlinePollTimer = setInterval(syncOnlineGame, 1000);
}

function showOnlineMenu() {
  const menu = document.getElementById("menuScreen");
  menu.innerHTML = `
    <h1>🌍 Online Tic-Tac-Toe</h1>
    <p class="subtitle">Play with a friend anywhere!</p>
    <button onclick="createOnlineRoom()">➕ Create Room</button>
    <button onclick="joinOnlineRoom()">🔑 Join Room</button>
    <button class="back" onclick="location.reload()">🏠 Back to Home</button>
    <p id="onlineMessage"></p>
  `;
}

async function createOnlineRoom() {
  const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();

  const { data, error } = await supabaseClient
    .from("games")
    .insert({
      room_code: roomCode,
      player_x: "X",
      player_o: "",
      board: ["", "", "", "", "", "", "", "", ""],
      turn: "X",
      winner: ""
    })
    .select()
    .single();

  if (error) {
    document.getElementById("onlineMessage").textContent =
      "Room error: " + error.message;
    return;
  }

  enterOnlineGame(roomCode, "X", data);
}

async function joinOnlineRoom() {
  const enteredCode = prompt("Enter your friend's room code:");
  if (!enteredCode) return;

  const roomCode = enteredCode.trim().toUpperCase();

  const { data, error } = await supabaseClient
    .from("games")
    .select("*")
    .eq("room_code", roomCode)
    .maybeSingle();

  if (error || !data) {
    alert("Room not found. Check the code and try again.");
    return;
  }

  if (data.player_o) {
    alert("This room already has two players.");
    return;
  }

  const { data: joinedRoom, error: joinError } = await supabaseClient
    .from("games")
    .update({ player_o: "O" })
    .eq("room_code", roomCode)
    .eq("player_o", "")
    .select()
    .maybeSingle();

  if (joinError || !joinedRoom) {
    alert("Couldn't join this room. It may already be full. Please try again.");
    return;
  }

  enterOnlineGame(roomCode, "O", joinedRoom);
}

async function syncOnlineGame() {
  if (!onlineGameActive || !onlineRoomCode) return;

  const { data, error } = await supabaseClient
    .from("games")
    .select("*")
    .eq("room_code", onlineRoomCode)
    .maybeSingle();

  if (error || !data) {
    document.getElementById("message").textContent =
      "Connection issue. Reconnecting...";
    return;
  }

  if (!data.player_o) {
    document.getElementById("message").textContent =
      "Waiting for your friend... Room code: " + onlineRoomCode;
    return;
  }

  const serverBoard = Array.isArray(data.board) && data.board.length === 9
    ? data.board
    : Array(9).fill("");

  const changed =
    JSON.stringify(board) !== JSON.stringify(serverBoard) ||
    currentPlayer !== (data.turn || "X");

  board = serverBoard;
  currentPlayer = data.turn || "X";

  if (changed) drawBoard();

  if (data.winner) {
    gameOver = true;

    if (onlineShownWinner !== data.winner) {
      onlineShownWinner = data.winner;

      if (data.winner === "DRAW") {
        document.getElementById("message").textContent = "🤝 DRAW!";
        showPopup("DRAW!", "What a game! 🤝", "😮");
      } else {
        if (data.winner === "X") xScore++;
        if (data.winner === "O") oScore++;
        updateScore();

        if (data.winner === onlinePlayer) {
          document.getElementById("message").textContent = "🎉 YOU WIN!";
          showPopup("YOU WIN! 🏆", "Congratulations, champion! 🎉", "🏆");
        } else {
          document.getElementById("message").textContent = "😔 YOU LOSE!";
          showPopup("YOU LOSE 😔", "Better luck next time!", "💙");
        }
      }
    }

    updateTurn();
    return;
  }

  gameOver = false;
  updateTurn();
  document.getElementById("message").textContent =
    currentPlayer === onlinePlayer
      ? "Your turn!"
      : "Waiting for your opponent...";
}

function findOnlineWinner(cells) {
  const lines = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];

  for (const line of lines) {
    const [a, b, c] = line;
    if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
      return cells[a];
    }
  }

  return null;
}

async function onlineMove(index) {
  if (!onlineGameActive || gameOver) return;

  if (currentPlayer !== onlinePlayer) {
    document.getElementById("message").textContent = "Wait for your turn!";
    return;
  }

  if (board[index] !== "") return;

  const nextBoard = [...board];
  nextBoard[index] = onlinePlayer;

  const winner = findOnlineWinner(nextBoard);
  const isDraw = !winner && nextBoard.every(cell => cell !== "");
  const result = winner || (isDraw ? "DRAW" : "");
  const nextTurn = onlinePlayer === "X" ? "O" : "X";

  document.getElementById("message").textContent = "Saving your move...";

  const { error } = await supabaseClient
    .from("games")
    .update({
      board: nextBoard,
      turn: nextTurn,
      winner: result
    })
    .eq("room_code", onlineRoomCode)
    .eq("turn", onlinePlayer)
    .eq("winner", "");

  if (error) {
    document.getElementById("message").textContent =
      "Move not saved. Please try again.";
    await syncOnlineGame();
    return;
  }

  board = nextBoard;
  currentPlayer = nextTurn;
  if (result) gameOver = true;

  drawBoard();
  updateTurn();
  await syncOnlineGame();
}

function showDifficulty() {
  document.getElementById("menuScreen").classList.add("hidden");
  document.getElementById("difficultyScreen").classList.remove("hidden");
}

function chooseBoard(mode, level) {
  gameMode = mode;
  if (level) difficulty = level;

  document.getElementById("menuScreen").classList.add("hidden");
  document.getElementById("difficultyScreen").classList.add("hidden");
  document.getElementById("boardSizeScreen").classList.remove("hidden");
}

function startGame(size) {
  boardSize = size;
  winLength = boardSize === 3 ? 3 : 4;
  xScore = 0;
  oScore = 0;
  updateScore();

  document.getElementById("boardSizeScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  newRound();
}

function backFromBoardSize() {
  document.getElementById("boardSizeScreen").classList.add("hidden");

  if (gameMode === "ai") {
    document.getElementById("difficultyScreen").classList.remove("hidden");
  } else {
    document.getElementById("menuScreen").classList.remove("hidden");
  }
}

function showMenu() {
  gameOver = true;

  if (onlinePollTimer) {
    clearInterval(onlinePollTimer);
    onlinePollTimer = null;
  }

  onlineGameActive = false;
  onlineRoomCode = null;
  onlinePlayer = null;

  closePopup();

  document.getElementById("welcomeScreen").classList.add("hidden");
  document.getElementById("difficultyScreen").classList.add("hidden");
  document.getElementById("boardSizeScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("menuScreen").classList.remove("hidden");
}

async function newRound() {
  closePopup();

  if (onlineGameActive && gameMode === "online") {
    const emptyBoard = Array(9).fill("");

    const { error } = await supabaseClient
      .from("games")
      .update({ board: emptyBoard, turn: "X", winner: "" })
      .eq("room_code", onlineRoomCode);

    if (error) {
      document.getElementById("message").textContent =
        "Couldn't restart the online game. Try again.";
      return;
    }

    onlineShownWinner = null;
    board = emptyBoard;
    currentPlayer = "X";
    gameOver = false;

    drawBoard();
    updateTurn();
    document.getElementById("message").textContent =
      currentPlayer === onlinePlayer
        ? "Your turn!"
        : "Waiting for your opponent...";

    await syncOnlineGame();
    return;
  }

  board = new Array(boardSize * boardSize).fill("");
  currentPlayer = "X";
  gameOver = false;

  document.getElementById("message").textContent = "";
  document.getElementById("boardSizeText").textContent =
    "Board: " + boardSize + " × " + boardSize;

  drawBoard();
  updateTurn();
}

function drawBoard() {
  const boardElement = document.getElementById("board");
  boardElement.innerHTML = "";
  boardElement.className = "size-" + boardSize;
  boardElement.style.gridTemplateColumns =
    "repeat(" + boardSize + ", 1fr)";

  board.forEach(function(value, index) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.textContent = value;

    cell.onclick = function() {
      playerMove(index);
    };

    boardElement.appendChild(cell);
  });
}

function playerMove(index) {
  if (onlineGameActive && gameMode === "online") {
    onlineMove(index);
    return;
  }

  if (gameOver) return;
  if (board[index] !== "") return;
  if (gameMode === "ai" && currentPlayer === "O") return;

  board[index] = currentPlayer;
  drawBoard();

  if (checkGame()) return;

  currentPlayer = currentPlayer === "X" ? "O" : "X";
  updateTurn();

  if (gameMode === "ai" && currentPlayer === "O") {
    setTimeout(aiMove, 500);
  }
}

function aiMove() {
  if (gameOver) return;

  let move;
  if (difficulty === "easy") {
    move = randomMove();
  } else {
    move = smartMove();
  }

  if (move !== -1) {
    board[move] = "O";
    drawBoard();

    if (checkGame()) return;

    currentPlayer = "X";
    updateTurn();
  }
}

function randomMove() {
  const empty = [];

  for (let i = 0; i < board.length; i++) {
    if (board[i] === "") empty.push(i);
  }

  if (empty.length === 0) return -1;
  return empty[Math.floor(Math.random() * empty.length)];
}

function smartMove() {
  for (let i = 0; i < board.length; i++) {
    if (board[i] === "") {
      board[i] = "O";
      if (getWinner() === "O") {
        board[i] = "";
        return i;
      }
      board[i] = "";
    }
  }

  for (let i = 0; i < board.length; i++) {
    if (board[i] === "") {
      board[i] = "X";
      if (getWinner() === "X") {
        board[i] = "";
        return i;
      }
      board[i] = "";
    }
  }

  const center = Math.floor(board.length / 2);
  if (board[center] === "") return center;

  return randomMove();
}

function getWinner() {
  const directions = [[0,1], [1,0], [1,1], [1,-1]];

  for (let row = 0; row < boardSize; row++) {
    for (let col = 0; col < boardSize; col++) {
      const index = row * boardSize + col;
      if (board[index] === "") continue;

      const player = board[index];

      for (const direction of directions) {
        const dr = direction[0];
        const dc = direction[1];
        let count = 1;

        for (let step = 1; step < winLength; step++) {
          const newRow = row + dr * step;
          const newCol = col + dc * step;

          if (
            newRow < 0 || newRow >= boardSize ||
            newCol < 0 || newCol >= boardSize
          ) break;

          const newIndex = newRow * boardSize + newCol;

          if (board[newIndex] === player) {
            count++;
          } else {
            break;
          }
        }

        if (count >= winLength) return player;
      }
    }
  }

  return null;
}

function checkGame() {
  const winner = getWinner();

  if (winner) {
    gameOver = true;

    if (winner === "X") {
      xScore++;
      document.getElementById("message").textContent = "🎉 X WINS!";
    } else {
      oScore++;
      document.getElementById("message").textContent = "🎉 O WINS!";
    }

    showPopup(winner + " WINS!", "Congratulations! 🎉", "🏆");
    updateScore();
    return true;
  }

  if (!board.includes("")) {
    gameOver = true;
    document.getElementById("message").textContent = "🤝 DRAW!";
    showPopup("DRAW!", "What a game! 🤝", "😮");
    return true;
  }

  return false;
}

function updateTurn() {
  if (gameMode === "online") {
    document.getElementById("turnText").textContent =
      currentPlayer === onlinePlayer
        ? "Your turn: " + onlinePlayer
        : "Opponent's turn: " + currentPlayer;
  } else if (gameMode === "ai" && currentPlayer === "O") {
    document.getElementById("turnText").textContent =
      "🤖 AI is thinking...";
  } else if (gameMode === "ai") {
    document.getElementById("turnText").textContent = "Your turn: X";
  } else {
    document.getElementById("turnText").textContent =
      "Turn: " + currentPlayer;
  }
}

function updateScore() {
  document.getElementById("xScore").textContent = xScore;
  document.getElementById("oScore").textContent = oScore;
}

function showPopup(title, text, emoji) {
  document.getElementById("popupTitle").textContent = title;
  document.getElementById("popupText").textContent = text;
  document.getElementById("popupEmoji").textContent = emoji;
  document.getElementById("resultPopup").classList.remove("hidden");
}

function closePopup() {
  document.getElementById("resultPopup").classList.add("hidden");
}
</script>
