```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #111827, #1d4ed8);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  text-align: center;
}

.screen {
  background: rgba(255,255,255,0.1);
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

h1 {
  font-size: 45px;
  margin-bottom: 10px;
}

h2 {
  margin-bottom: 20px;
}

.subtitle {
  color: #dbeafe;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: white;
  color: #111827;
}

button:hover {
  transform: scale(1.02);
}

button:active {
  transform: scale(0.98);
}

.back {
  background: #374151;
  color: white;
}

.hidden {
  display: none !important;
}

#board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px 0;
}

.cell {
  aspect-ratio: 1;
  background: white;
  color: #111827;
  border-radius: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 55px;
  font-weight: bold;
  cursor: pointer;
}

.cell:hover {
  background: #e5e7eb;
}

.info {
  font-size: 20px;
  margin: 10px;
}

.score {
  display: flex;
  justify-content: space-around;
  margin: 15px 0;
}

#message {
  min-height: 30px;
  font-size: 22px;
  font-weight: bold;
  margin: 10px;
}

@media (max-width: 500px) {
  h1 {
    font-size: 35px;
  }

  .cell {
    font-size: 45px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- WELCOME SCREEN -->
  <div id="welcomeScreen" class="screen">

    <h1>🎮 Tic-Tac-Toe</h1>

    <p class="subtitle">
      Welcome to the ultimate Tic-Tac-Toe game
    </p>

    <button onclick="enterGame()">
      ENTER
    </button>

  </div>


  <!-- MAIN MENU -->
  <div id="menuScreen" class="screen hidden">

    <h1>🎮 Tic-Tac-Toe</h1>

    <p class="subtitle">
      Choose your game
    </p>

    <button onclick="startPVP()">
      👥 1 VS 1
    </button>

    <button onclick="showDifficulty()">
      🤖 PLAY AI
    </button>

  </div>


  <!-- DIFFICULTY SCREEN -->
  <div id="difficultyScreen" class="screen hidden">

    <h2>Choose Difficulty</h2>

    <button onclick="startAI('easy')">
      🟢 EASY
    </button>

    <button onclick="startAI('medium')">
      🟡 MEDIUM
    </button>

    <button onclick="startAI('hard')">
      🔴 HARD
    </button>

    <button class="back" onclick="showMenu()">
      ← BACK
    </button>

  </div>


  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen hidden">

    <h2>Tic-Tac-Toe</h2>

    <div class="info" id="turnText">
      Turn: X
    </div>

    <div class="score">
      <span>❌ X: <b id="xScore">0</b></span>
      <span>⭕ O: <b id="oScore">0</b></span>
    </div>

    <div id="board"></div>

    <div id="message"></div>

    <button onclick="newRound()">
      🔄 NEW ROUND
    </button>

    <button class="back" onclick="showMenu()">
      🏠 MAIN MENU
    </button>

  </div>

</div>


<script>

let board = [];
let currentPlayer = "X";
let gameMode = "pvp";
let difficulty = "easy";
let gameOver = false;

let xScore = 0;
let oScore = 0;

const winningLines = [
  [0,1,2],
  [3,4,5],
  [6,7,8],
  [0,3,6],
  [1,4,7],
  [2,5,8],
  [0,4,8],
  [2,4,6]
];


// ENTER BUTTON
function enterGame() {

  document.getElementById("welcomeScreen")
    .classList.add("hidden");

  document.getElementById("menuScreen")
    .classList.remove("hidden");

}


// 1 VS 1
function startPVP() {

  gameMode = "pvp";

  xScore = 0;
  oScore = 0;

  updateScore();

  document.getElementById("menuScreen")
    .classList.add("hidden");

  document.getElementById("gameScreen")
    .classList.remove("hidden");

  newRound();
}


// SHOW AI DIFFICULTY
function showDifficulty() {

  document.getElementById("menuScreen")
    .classList.add("hidden");

  document.getElementById("difficultyScreen")
    .classList.remove("hidden");

}


// START AI
function startAI(level) {

  gameMode = "ai";
  difficulty = level;

  xScore = 0;
  oScore = 0;

  updateScore();

  document.getElementById("difficultyScreen")
    .classList.add("hidden");

  document.getElementById("gameScreen")
    .classList.remove("hidden");

  newRound();

}


// BACK TO MENU
function showMenu() {

  gameOver = true;

  document.getElementById("welcomeScreen")
    .classList.add("hidden");

  document.getElementById("difficultyScreen")
    .classList.add("hidden");

  document.getElementById("gameScreen")
    .classList.add("hidden");

  document.getElementById("menuScreen")
    .classList.remove("hidden");

}


// NEW ROUND
function newRound() {

  board = ["","","","","","","","",""];

  currentPlayer = "X";

  gameOver = false;

  document.getElementById("message").textContent = "";

  drawBoard();

  updateTurn();

}


// DRAW BOARD
function drawBoard() {

  const boardElement = document.getElementById("board");

  boardElement.innerHTML = "";

  board.forEach(function(value, index) {

    const cell = document.createElement("div");

    cell.className = "cell";

    cell.textContent = value;

    cell.onclick = function() {

      playerMove(index);

    };

    boardElement.appendChild(cell);

  });

}


// PLAYER MOVE
function playerMove(index) {

  if (gameOver) return;

  if (board[index] !== "") return;

  if (gameMode === "ai" && currentPlayer === "O") return;

  board[index] = currentPlayer;

  drawBoard();

  if (checkGame()) return;

  currentPlayer =
    currentPlayer === "X" ? "O" : "X";

  updateTurn();


  // AI TURN
  if (
    gameMode === "ai" &&
    currentPlayer === "O"
  ) {

    setTimeout(aiMove, 500);

  }

}


// AI MOVE
function aiMove() {

  if (gameOver) return;

  let move;

  if (difficulty === "easy") {

    move = randomMove();

  }

  else if (difficulty === "medium") {

    move = mediumMove();

  }

  else {

    move = bestMove();

  }

  if (move !== -1) {

    board[move] = "O";

    drawBoard();

    if (checkGame()) return;

    currentPlayer = "X";

    updateTurn();

  }

}


// EASY
function randomMove() {

  const empty = [];

  for (let i = 0; i < 9; i++) {

    if (board[i] === "") {

      empty.push(i);

    }

  }

  if (empty.length === 0) return -1;

  return empty[
    Math.floor(Math.random() * empty.length)
  ];

}


// MEDIUM
function mediumMove() {

  // AI tries to win
  for (let i = 0; i < 9; i++) {

    if (board[i] === "") {

      board[i] = "O";

      if (getWinner() === "O") {

        board[i] = "";

        return i;

      }

      board[i] = "";

    }

  }


  // AI blocks player
  for (let i = 0; i < 9; i++) {

    if (board[i] === "") {

      board[i] = "X";

      if (getWinner() === "X") {

        board[i] = "";

        return i;

      }

      board[i] = "";

    }

  }


  // Center
  if (board[4] === "") {

    return 4;

  }


  return randomMove();

}


// HARD AI
function bestMove() {

  let bestScore = -Infinity;

  let move = -1;

  for (let i = 0; i < 9; i++) {

    if (board[i] === "") {

      board[i] = "O";

      let score = minimax(false);

      board[i] = "";

      if (score > bestScore) {

        bestScore = score;

        move = i;

      }

    }

  }

  return move;

}


function minimax(isMaximizing) {

  const winner = getWinner();

  if (winner === "O") return 10;

  if (winner === "X") return -10;

  if (!board.includes("")) return 0;


  if (isMaximizing) {

    let bestScore = -Infinity;

    for (let i = 0; i < 9; i++) {

      if (board[i] === "") {

        board[i] = "O";

        let score = minimax(false);

        board[i] = "";

        bestScore = Math.max(
          bestScore,
          score
        );

      }

    }

    return bestScore;

  }


  else {

    let bestScore = Infinity;

    for (let i = 0; i < 9; i++) {

      if (board[i] === "") {

        board[i] = "X";

        let score = minimax(true);

        board[i] = "";

        bestScore = Math.min(
          bestScore,
          score
        );

      }

    }

    return bestScore;

  }

}


// FIND WINNER
function getWinner() {

  for (const line of winningLines) {

    const a = line[0];
    const b = line[1];
    const c = line[2];

    if (
      board[a] !== "" &&
      board[a] === board[b] &&
      board[a] === board[c]
    ) {

      return board[a];

    }

  }

  return null;

}


// CHECK GAME
function checkGame() {

  const winner = getWinner();

  if (winner) {

    gameOver = true;

    if (winner === "X") {

      xScore++;

      document.getElementById("message")
        .textContent = "🎉 X WINS!";

    }

    else {

      oScore++;

      document.getElementById("message")
        .textContent = "🎉 O WINS!";

    }

    updateScore();

    return true;

  }


  if (!board.includes("")) {

    gameOver = true;

    document.getElementById("message")
      .textContent = "🤝 DRAW!";

    return true;

  }

  return false;

}


// UPDATE TURN
function updateTurn() {

  if (
    gameMode === "ai" &&
    currentPlayer === "O"
  ) {

    document.getElementById("turnText")
      .textContent = "🤖 AI is thinking...";

  }

  else if (gameMode === "ai") {

    document.getElementById("turnText")
      .textContent = "Your turn: X";

  }

  else {

    document.getElementById("turnText")
      .textContent =
      "Turn: " + currentPlayer;

  }

}


// UPDATE SCORE
function updateScore() {

  document.getElementById("xScore")
    .textContent = xScore;

  document.getElementById("oScore")
    .textContent = oScore;

}

</script>

</body>
</html>
```
