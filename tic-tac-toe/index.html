<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #111827, #1e3a8a);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

.subtitle {
  color: #cbd5e1;
  margin-bottom: 25px;
}

.menu, .game {
  background: rgba(255,255,255,0.1);
  padding: 25px;
  border-radius: 25px;
  backdrop-filter: blur(10px);
}

button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: white;
  color: #111827;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.03);
}

button:active {
  transform: scale(0.98);
}

#board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px 0;
}

.cell {
  aspect-ratio: 1;
  background: white;
  color: #111827;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  font-weight: bold;
  cursor: pointer;
}

.cell:hover {
  background: #e5e7eb;
}

.info {
  font-size: 20px;
  margin: 10px 0;
}

.score {
  display: flex;
  justify-content: space-around;
  margin: 15px 0;
  font-size: 18px;
}

.hidden {
  display: none;
}

#message {
  min-height: 30px;
  font-size: 22px;
  font-weight: bold;
  margin: 10px;
}

.back {
  background: #374151;
  color: white;
}

@media (max-width: 500px) {
  h1 {
    font-size: 34px;
  }

  .cell {
    font-size: 45px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🎮 Tic-Tac-Toe</h1>
  <p class="subtitle">Choose your game</p>

  <!-- MENU -->
  <div id="menu" class="menu">

    <button onclick="startGame('pvp')">
      👥 1 VS 1
    </button>

    <button onclick="showDifficulty()">
      🤖 PLAY AI
    </button>

  </div>

  <!-- DIFFICULTY -->
  <div id="difficulty" class="menu hidden">

    <h2>Choose Difficulty</h2>

    <button onclick="startGame('easy')">
      🟢 EASY
    </button>

    <button onclick="startGame('medium')">
      🟡 MEDIUM
    </button>

    <button onclick="startGame('hard')">
      🔴 HARD
    </button>

    <button class="back" onclick="backToMenu()">
      ← BACK
    </button>

  </div>

  <!-- GAME -->
  <div id="game" class="game hidden">

    <div class="info" id="turn">
      Your turn: X
    </div>

    <div class="score">
      <span>❌ X: <b id="xScore">0</b></span>
      <span>⭕ O: <b id="oScore">0</b></span>
    </div>

    <div id="board"></div>

    <div id="message"></div>

    <button onclick="newRound()">
      🔄 New Round
    </button>

    <button class="back" onclick="backToMenu()">
      🏠 Main Menu
    </button>

  </div>

</div>

<script>

let board = [];
let currentPlayer = "X";
let gameMode = "pvp";
let gameOver = false;

let xScore = 0;
let oScore = 0;

const winningLines = [
  [0,1,2],
  [3,4,5],
  [6,7,8],
  [0,3,6],
  [1,4,7],
  [2,5,8],
  [0,4,8],
  [2,4,6]
];

function showDifficulty() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("difficulty").classList.remove("hidden");
}

function backToMenu() {
  document.getElementById("menu").classList.remove("hidden");
  document.getElementById("difficulty").classList.add("hidden");
  document.getElementById("game").classList.add("hidden");

  gameOver = true;
}

function startGame(mode) {

  gameMode = mode;

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("difficulty").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  xScore = 0;
  oScore = 0;

  updateScore();

  newRound();
}

function newRound() {

  board = ["","","","","","","","",""];

  currentPlayer = "X";
  gameOver = false;

  document.getElementById("message").textContent = "";

  updateTurn();
  drawBoard();
}

function drawBoard() {

  const boardElement = document.getElementById("board");

  boardElement.innerHTML = "";

  board.forEach((value, index) => {

    const cell = document.createElement("div");

    cell.className = "cell";
    cell.textContent = value;

    cell.onclick = function() {
      playMove(index);
    };

    boardElement.appendChild(cell);

  });
}

function playMove(index) {

  if (gameOver) return;

  if (board[index] !== "") return;

  if (gameMode !== "pvp" && currentPlayer === "O") return;

  board[index] = currentPlayer;

  drawBoard();

  if (checkGame()) return;

  currentPlayer = currentPlayer === "X" ? "O" : "X";

  updateTurn();

  if (gameMode !== "pvp" && currentPlayer === "O") {

    setTimeout(aiMove, 400);

  }
}

function aiMove() {

  if (gameOver) return;

  let move;

  if (gameMode === "easy") {
    move = randomMove();
  }

  else if (gameMode === "medium") {
    move = mediumMove();
  }

  else {
    move = bestMove();
  }

  if (move !== -1) {

    board[move] = "O";

    drawBoard();

    if (checkGame()) return;

    currentPlayer = "X";

    updateTurn();
  }
}

function randomMove() {

  const empty = [];

  board.forEach((value, index) => {

    if (value === "") {
      empty.push(index);
    }

  });

  if (empty.length === 0) return -1;

  return empty[Math.floor(Math.random() * empty.length)];
}

function mediumMove() {

  // Try to win
  for (let i = 0; i < 9; i++) {

    if (board[i] === "") {

      board[i] = "O";

      if (getWinner() === "O") {

        board[i] = "";

        return i;
      }

      board[i] = "";
    }
  }

  // Block player
  for (let i = 0; i < 9; i++) {

    if (board[i] === "") {

      board[i] = "X";

      if (getWinner() === "X") {

        board[i] = "";

        return i;
      }

      board[i] = "";
    }
  }

  // Take center
  if (board[4] === "") return 4;

  return randomMove();
}

function bestMove() {

  let bestScore = -Infinity;
  let move = -1;

  for (let i = 0; i < 9; i++) {

    if (board[i] === "") {

      board[i] = "O";

      let score = minimax(board, false);

      board[i] = "";

      if (score > bestScore) {

        bestScore = score;
        move = i;

      }
    }
  }

  return move;
}

function minimax(state, isMaximizing) {

  let winner = getWinner();

  if (winner === "O") return 10;
  if (winner === "X") return -10;

  if (!state.includes("")) return 0;

  if (isMaximizing) {

    let bestScore = -Infinity;

    for (let i = 0; i < 9; i++) {

      if (state[i] === "") {

        state[i] = "O";

        let score = minimax(state, false);

        state[i] = "";

        bestScore = Math.max(bestScore, score);
      }
    }

    return bestScore;

  } else {

    let bestScore = Infinity;

    for (let i = 0; i < 9; i++) {

      if (state[i] === "") {

        state[i] = "X";

        let score = minimax(state, true);

        state[i] = "";

        bestScore = Math.min(bestScore, score);
      }
    }

    return bestScore;
  }
}

function getWinner() {

  for (const line of winningLines) {

    const [a,b,c] = line;

    if (
      board[a] &&
      board[a] === board[b] &&
      board[a] === board[c]
    ) {

      return board[a];

    }
  }

  return null;
}

function checkGame() {

  const winner = getWinner();

  if (winner) {

    gameOver = true;

    if (winner === "X") {

      xScore++;

      document.getElementById("message").textContent =
        "🎉 X WINS!";

    } else {

      oScore++;

      document.getElementById("message").textContent =
        "🎉 O WINS!";

    }

    updateScore();

    return true;
  }

  if (!board.includes("")) {

    gameOver = true;

    document.getElementById("message").textContent =
      "🤝 DRAW!";

    return true;
  }

  return false;
}

function updateTurn() {

  const turn = document.getElementById("turn");

  if (gameMode === "pvp") {

    turn.textContent = "Turn: " + currentPlayer;

  } else {

    if (currentPlayer === "X") {

      turn.textContent = "Your turn: X";

    } else {

      turn.textContent = "🤖 AI is thinking...";

    }
  }
}

function updateScore() {

  document.getElementById("xScore").textContent = xScore;
  document.getElementById("oScore").textContent = oScore;
}

</script>

</body>
</html>
